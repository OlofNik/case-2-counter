<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Счетчик</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="counter">

        <h1>Счетчик</h1>

        <div id="result" class="result">
            0
        </div>

        <div class="buttons">

            <button id="minus">
                Минус
            </button>

            <button id="plus">
                Плюс
            </button>

        </div>

        <div id="message" class="message"></div>

    </main>

    <script src="script.js"></script>

</body>

</html>
